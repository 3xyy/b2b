name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once, and let a queued one finish rather than
# cancelling it — a cancelled deploy can leave the site half-published.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `output: export` writes the site to ./out. NEXT_PUBLIC_SITE_URL is left
      # unset on purpose: site.url then defaults to the production origin, which
      # is what robots.txt, the sitemap, and metadataBase should advertise.
      - name: Build
        run: npm run build

      # Without this, Pages runs the output through Jekyll, which strips the
      # _next directory and takes every asset with it.
      - name: Add .nojekyll
        run: touch ./out/.nojekyll

      # Reads the repo's existing Pages config. It cannot create the Pages site:
      # the Actions token is refused ("Resource not accessible by integration"),
      # so Pages must be switched on once by hand under
      # Settings → Pages → Source: GitHub Actions.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
